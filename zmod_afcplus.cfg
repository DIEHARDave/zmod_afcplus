# Zmod AFC Plus: additions to Zmod's built-in AFC panel (zmod_afc, Zmod 1.7.5+).
# All options are on by default; set one to False to turn it off.
[zmod_afcplus]
# While HelixScreen manages lane_data (helix = 1), keep its entries on Zmod's slots (OrcaSlicer).
#lane_data: True
# Creator 5: lanes map to their own toolhead between prints.
#toolchanger_idle_map: True
# Lanes (AFC panel and lane_data) show the Spoolman spool's own color while Zmod stores it as the slot color.
#spool_colors: True
#moonraker_url: http://127.0.0.1:7125
